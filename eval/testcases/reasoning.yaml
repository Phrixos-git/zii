version: 1
cases:
  - id: arithmetic_steps
    category: reasoning
    tools: none
    prompt: "箱に赤い玉が12個、青い玉が8個あります。赤を5個取り出し、青を3個追加しました。残りの玉の合計数を、半角数字だけで答えてください。"
    expect:
      equals: "18"
  - id: sort_deduplicate
    category: reasoning
    tools: none
    prompt: "[8, 3, 8, 1, 5, 3] から重複を除いて昇順に並べ、JSON配列だけで答えてください。"
    expect:
      pattern: '^\[\s*1\s*,\s*3\s*,\s*5\s*,\s*8\s*\]$'
  - id: order_deduction
    category: reasoning
    tools: none
    prompt: "AさんはBさんより先に到着し、CさんはAさんより先に到着しました。最初に到着した人をA、B、Cのいずれか一文字だけで答えてください。"
    expect:
      equals: "C"
  - id: supplied_evidence
    category: reasoning
    tools: auto
    prompt: "この問題では、店Aの価格は1200円で送料300円、店Bの価格は1400円で送料無料です。安い方の店名と送料込みの金額を答えてください。金額はカンマなしの半角数字で記載してください。記載された条件だけで判断し、検索しないでください。"
    expect:
      contains: ["B", "1400"]
      max_tool_calls: 0
