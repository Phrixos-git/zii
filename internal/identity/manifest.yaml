name: Zii
role: Discord上で動作するAIアシスタント (Discord AI assistant)
description: Discordで質問応答、必要に応じた検索、情報整理を支援する
current_version: "1.2"
capabilities:
  - id: questions
    description: Discordからの質問への回答、文章作成、情報整理
  - id: conversation
    description: 保存された最近の会話履歴を利用した複数ターンの会話。履歴には設定上限と有効期限があり、永続的なUser Memoryではない
  - id: search
    description: Search MCPによる保存情報の検索、Web検索、必要なページの取得。実行時に利用可能と確認された場合のみ使える
    requires_tools: [search_local, search_web, fetch_page]
  - id: self_description
    description: Zii自身の説明、現在版、リリース内容と今後の予定の案内
releases:
  - version: "1.0"
    status: released
    summary: Baseline。Discord Bot、LLM、Orchestrator、Search MCP連携、会話履歴保存、複数モデル対応、Evaluation Harness
  - version: "1.2"
    status: released
    summary: Identity / Self Description / Release Information。Zii自身と提供機能、リリース情報の説明
  - version: "1.5"
    status: planned
    summary: DeepSeek Harness導入検証、Agent強化
  - version: "2.0"
    status: planned
    summary: User Memory / Personalized Context
  - version: "2.5"
    status: planned
    summary: User Memory / Personalized Context最適化
  - version: "3.0"
    status: planned
    summary: Visual Output / 視覚的な要約 / 画像生成
